<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020604">
<title>AMINUL ISLAM | CYBER MAP</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
  --green:#00ff91;
  --dark:#020604;
  --panel:#07120d;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--dark);
  color:#d9ffea;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
button,input { font:inherit; }
button {
  background:#071c12;
  color:var(--green);
  border:1px solid #145b39;
  padding:11px;
  border-radius:6px;
  cursor:pointer;
}
button:active { background:#17472d; }
#intro {
  position:fixed;
  inset:0;
  z-index:5000;
  background:radial-gradient(ellipse,#0b2115 0%,#020604 65%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  transition:opacity 1s, visibility 1s;
}
#intro.hide {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.intro-inner {
  text-align:center;
  width:min(100%,390px);
}
.eyebrow {
  color:var(--green);
  font-size:10px;
  letter-spacing:4px;
}
.scanner {
  position:relative;
  width:210px;
  height:210px;
  margin:26px auto;
  display:grid;
  place-items:center;
  border:1px solid #00ff9155;
  border-radius:50%;
  background:repeating-radial-gradient(
    circle,transparent 0 23px,#00ff9118 24px 25px
  );
  animation:rotate 12s linear infinite;
}
.scanner:before,.scanner:after {
  content:"";
  position:absolute;
  inset:13px;
  border:1px dashed #00ff9166;
  border-radius:50%;
}
.scanner:after {
  inset:36px;
  border-style:solid;
}
.face {
  width:75px;
  height:100px;
  border:2px solid var(--green);
  border-radius:48% 48% 42% 42%;
  position:relative;
  box-shadow:0 0 25px #00ff9144;
  animation:pulse 2s infinite;
}
.face:before {
  content:"";
  position:absolute;
  width:100%;
  height:2px;
  background:var(--green);
  left:0;
  top:40%;
  box-shadow:0 0 12px var(--green);
  animation:scan 2s ease-in-out infinite alternate;
}
.face:after {
  content:"";
  position:absolute;
  left:20%;
  right:20%;
  top:32%;
  height:9px;
  border-top:2px solid var(--green);
  border-bottom:2px solid var(--green);
}
@keyframes rotate { to { transform:rotate(360deg); } }
@keyframes scan { to { top:85%; } }
@keyframes pulse {
  50% { box-shadow:0 0 35px #00ff9177; }
}
h1 {
  color:var(--green);
  font-size:clamp(27px,7vw,39px);
  letter-spacing:3px;
  margin:10px 0;
  text-shadow:0 0 20px #00ff9160;
}
.sub {
  font-size:10px;
  letter-spacing:2px;
  color:#91b6a0;
  line-height:2;
}
.progress {
  height:3px;
  background:#123321;
  margin:23px 0 12px;
  overflow:hidden;
}
#bar {
  width:0;
  height:100%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}
#status {
  color:var(--green);
  font-size:10px;
  min-height:16px;
  letter-spacing:1px;
}
#skip {
  margin-top:20px;
  font-size:11px;
}
#app { height:100dvh; width:100%; }
.topbar {
  position:absolute;
  z-index:1000;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  pointer-events:none;
}
.brand,.live {
  background:#041009ed;
  border:1px solid #00ff914d;
  padding:10px 12px;
  border-radius:7px;
  pointer-events:auto;
}
.brand {
  font-size:13px;
  font-weight:bold;
  color:var(--green);
  letter-spacing:1px;
}
.live { color:var(--green); font-size:10px; }
#map { width:100%; height:100%; background:#07110b; }
.toolbar {
  position:absolute;
  z-index:1000;
  top:76px;
  left:12px;
  width:min(310px,calc(100% - 24px));
  padding:12px;
  background:#041009ed;
  border:1px solid #00ff914d;
  border-radius:9px;
}
.search { display:flex; gap:6px; }
input {
  width:100%;
  min-width:0;
  background:#020805;
  color:white;
  border:1px solid #17452c;
  border-radius:5px;
  padding:11px;
  outline:none;
}
.controls {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}
#info {
  position:absolute;
  z-index:1000;
  bottom:24px;
  left:12px;
  max-width:calc(100% - 24px);
  background:#041009ed;
  border:1px solid #00ff914d;
  padding:12px;
  border-radius:7px;
  font-size:11px;
  line-height:1.9;
  overflow-wrap:anywhere;
}
.green { color:var(--green); }
#credit {
  position:absolute;
  z-index:1000;
  right:12px;
  bottom:25px;
  color:#d1e9da;
  background:#041009ed;
  border:1px solid #00ff914d;
  border-radius:7px;
  padding:10px;
  font-size:10px;
  text-align:right;
}
#credit strong { color:var(--green); }
a { color:var(--green); }
.leaflet-popup-content-wrapper,.leaflet-popup-tip {
  background:#07120d;
  color:white;
}
@media(max-width:480px) {
  .scanner { width:170px;height:170px; }
  .face { transform:scale(.85); }
  .toolbar { top:69px; }
  #info { bottom:16px; font-size:10px; }
  #credit { bottom:16px; font-size:9px; }
}
</style>
</head>
<body>

<section id="intro">
  <div class="intro-inner">
    <div class="eyebrow">AMINUL TECH WORLD</div>
    <div class="scanner"><div class="face"></div></div>
    <h1>AMINUL ISLAM</h1>
    <div class="sub">
      CYBER MAP INTERFACE<br>
      FICTIONAL FACE SCAN SIMULATION
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div id="status">INITIALIZING INTERFACE...</div>
    <button id="skip">OPEN MAP NOW ↗</button>
  </div>
</section>

<main id="app">
  <div id="map"></div>

  <div class="topbar">
    <div class="brand">◈ CYBER MAP</div>
    <div class="live">● <span id="clock">ONLINE</span></div>
  </div>

  <section class="toolbar">
    <form id="search" class="search">
      <input id="query" placeholder="Search city or place..." required>
      <button type="submit">GO ↗</button>
    </form>
    <div class="controls">
      <button id="locate">◎ MY LOCATION</button>
      <button id="satellite">🛰 SATELLITE</button>
      <button id="streets">▤ STREET MAP</button>
      <button id="zoomIn">＋ ZOOM IN</button>
      <button id="zoomOut">－ ZOOM OUT</button>
      <button id="fullscreen">⛶ FULLSCREEN</button>
    </div>
    <div id="feedback" class="sub" style="margin-top:9px">
      MAP SYSTEM READY
    </div>
  </section>

  <section id="info">
    <div class="green">◈ LOCATION INTEL</div>
    PLACE: <span id="place">World View</span><br>
    LAT: <span id="lat">--</span><br>
    LNG: <span id="lng">--</span><br>
    ZOOM: <span id="zoom">3</span>
  </section>

  <div id="credit">
    CREATED BY<br><strong>AMINUL ISLAM</strong>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let opened = false;

const lines = [
  "INITIALIZING CYBER INTERFACE...",
  "STARTING VISUAL SCANNER...",
  "SCANNER SIMULATION COMPLETE...",
  "PREPARING SATELLITE MAP...",
  "WELCOME TO AMINUL CYBER MAP"
];

let progress = 0;
const statusTimer = setInterval(() => {
  progress += 2;
  $("bar").style.width = progress + "%";
  $("status").textContent =
    lines[Math.min(Math.floor(progress / 22), lines.length - 1)];
  if (progress >= 100) {
    clearInterval(statusTimer);
    setTimeout(openMap, 500);
  }
}, 65);

$("skip").addEventListener("click", openMap);

function openMap() {
  if (opened) return;
  opened = true;
  clearInterval(statusTimer);
  $("bar").style.width = "100%";
  $("intro").classList.add("hide");
  setTimeout(() => map.invalidateSize(), 1100);
}

const map = L.map("map", {
  zoomControl: false
}).setView([22.9734, 78.6569], 3);

const imagery = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Imagery © Esri and its imagery providers"
  }
);

const streets = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
  }
);

imagery.addTo(map);
L.control.zoom({position:"bottomright"}).addTo(map);

let marker = null;
let selected = null;
let lastSearch = 0;

function safeText(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function setInfo(lat,lng,name) {
  selected = {lat,lng,name};
  $("place").textContent = name;
  $("lat").textContent = lat.toFixed(6);
  $("lng").textContent = lng.toFixed(6);
  $("zoom").textContent = map.getZoom();

  if (marker) map.removeLayer(marker);

  marker = L.marker([lat,lng]).addTo(map);
  marker.bindPopup(
    "<b style='color:#00ff91'>" + safeText(name) +
    "</b><br>" + lat.toFixed(6) + ", " + lng.toFixed(6) +
    "<br><a target='_blank' rel='noopener' href='https://www.google.com/maps/dir/?api=1&destination=" +
    lat + "," + lng + "'>Open directions ↗</a>"
  ).openPopup();
}

map.on("click", e => {
  setInfo(e.latlng.lat,e.latlng.lng,"Selected Map Point");
  $("feedback").textContent = "MAP POINT SELECTED";
});

map.on("zoomend", () => {
  $("zoom").textContent = map.getZoom();
});

$("satellite").onclick = () => {
  map.removeLayer(streets);
  imagery.addTo(map);
  $("feedback").textContent = "SATELLITE IMAGERY ACTIVE";
};

$("streets").onclick = () => {
  map.removeLayer(imagery);
  streets.addTo(map);
  $("feedback").textContent = "STREET MAP ACTIVE";
};

$("zoomIn").onclick = () => map.zoomIn();
$("zoomOut").onclick = () => map.zoomOut();

$("fullscreen").onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
    setTimeout(() => map.invalidateSize(),300);
  } catch {
    $("feedback").textContent = "FULLSCREEN NOT AVAILABLE";
  }
};

document.addEventListener("fullscreenchange", () => {
  setTimeout(() => map.invalidateSize(),300);
});

$("locate").onclick = () => {
  if (!navigator.geolocation) {
    $("feedback").textContent = "LOCATION NOT SUPPORTED";
    return;
  }

  $("feedback").textContent = "REQUESTING YOUR PERMISSION...";

  navigator.geolocation.getCurrentPosition(
    p => {
      const lat = p.coords.latitude;
      const lng = p.coords.longitude;
      map.flyTo([lat,lng],16);
      setInfo(lat,lng,"Your Current Location");
      $("feedback").textContent = "YOUR LOCATION DISPLAYED";
    },
    () => {
      $("feedback").textContent =
        "LOCATION UNAVAILABLE. CHECK PERMISSION AND GPS.";
    },
    {enableHighAccuracy:true,timeout:12000}
  );
};

$("search").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("query").value.trim();
  if (!q) return;

  if (Date.now() - lastSearch < 1100) {
    $("feedback").textContent = "PLEASE WAIT BEFORE SEARCHING AGAIN";
    return;
  }
  lastSearch = Date.now();
  $("feedback").textContent = "SEARCHING MAP...";

  try {
    const url = new URL("https://nominatim.openstreetmap.org/search");
    url.searchParams.set("q",q);
    url.searchParams.set("format","jsonv2");
    url.searchParams.set("limit","1");

    const res = await fetch(url);
    if (!res.ok) throw new Error();

    const results = await res.json();
    if (!results.length) {
      $("feedback").textContent = "NO PLACE FOUND";
      return;
    }

    const r = results[0];
    const lat = Number(r.lat);
    const lng = Number(r.lon);

    map.flyTo([lat,lng],15,{duration:1.5});
    setInfo(lat,lng,r.display_name);
    $("feedback").textContent = "LOCATION FOUND";
  } catch {
    $("feedback").textContent = "SEARCH FAILED. CHECK INTERNET.";
  }
});

function updateClock() {
  $("clock").textContent = new Date().toLocaleTimeString();
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
